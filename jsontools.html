<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 工具</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 150px;
        }
        textarea.output {
            background-color: #f5f5f5;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #333;
        }

        /* Pipeline steps display */
        .pipeline {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .pipe-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .pipe-toggle {
            padding: 10px 18px;
            border: 2px solid #ccc;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
        }
        .pipe-toggle:hover {
            border-color: #999;
            color: #333;
        }
        .pipe-toggle.on {
            border-color: #4CAF50;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .pipe-toggle.off {
            border-color: #ccc;
            background: #fff;
            color: #666;
        }
        .pipe-arrow {
            font-size: 20px;
            color: #bbb;
            font-weight: bold;
        }
        .pipe-arrow.active {
            color: #4CAF50;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .button-row button {
            flex: 1;
            min-width: 100px;
        }
        .btn-copy {
            background-color: #607D8B;
        }
        .btn-copy:hover {
            background-color: #546E7A;
        }
        .btn-clear {
            background-color: #999;
        }
        .btn-clear:hover {
            background-color: #777;
        }

        .error-msg {
            color: #D32F2F;
            font-size: 13px;
            margin-top: 4px;
            min-height: 18px;
        }
        .success-msg {
            color: #388E3C;
            font-size: 13px;
            margin-top: 4px;
            min-height: 18px;
        }
        .pipeline-legend {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* Steps indicator */
        .steps-label {
            font-size: 12px;
            margin-top: 2px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JSON 工具</h1>

        <!-- 输入 -->
        <label for="jsonInput">输入：</label>
        <textarea id="jsonInput" placeholder='输入 JSON 或字符串，例如: {"name":"hello","items":[1,2,3]}'></textarea>

        <!-- 管道步骤选择 -->
        <div class="pipeline" id="pipeline">
            <div class="pipe-step">
                <button class="pipe-toggle off" data-step="unescape">反转义</button>
                <span class="steps-label">①</span>
            </div>
            <span class="pipe-arrow" id="arrow1">→</span>
            <div class="pipe-step">
                <button class="pipe-toggle off" data-step="decompress">解压</button>
                <span class="steps-label">②</span>
            </div>
            <span class="pipe-arrow" id="arrow2">→</span>
            <div class="pipe-step">
                <button class="pipe-toggle off" data-step="compress">压缩</button>
                <span class="steps-label">③</span>
            </div>
            <span class="pipe-arrow" id="arrow3">→</span>
            <div class="pipe-step">
                <button class="pipe-toggle off" data-step="escape">转义</button>
                <span class="steps-label">④</span>
            </div>
        </div>
        <p class="pipeline-legend">点击开关选择要执行的操作，可以任意组合。从上到下按顺序执行。</p>

        <!-- 输出 -->
        <label for="jsonOutput">输出：</label>
        <textarea id="jsonOutput" class="output" readonly placeholder="处理结果将显示在这里..."></textarea>

        <div class="button-row">
            <button id="executeBtn">执行</button>
            <button id="copyBtn" class="btn-copy" style="display:none;">复制结果</button>
            <button id="clearBtn" class="btn-clear">清空</button>
        </div>

        <div id="outputMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script src="jsontools.js"></script>
</body>
</html>
