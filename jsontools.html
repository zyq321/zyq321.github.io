<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 工具</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 150px;
        }
        textarea.output {
            background-color: #f5f5f5;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #333;
        }

        /* 两个选择框并排 */
        .select-row {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        .select-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .select-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            cursor: pointer;
            appearance: auto;
            box-sizing: border-box;
        }
        .select-group select:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .select-group .select-label {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .button-row button {
            flex: 1;
            min-width: 100px;
        }
        .btn-copy {
            background-color: #607D8B;
        }
        .btn-copy:hover {
            background-color: #546E7A;
        }
        .btn-clear {
            background-color: #999;
        }
        .btn-clear:hover {
            background-color: #777;
        }

        .error-msg {
            color: #D32F2F;
            font-size: 13px;
            margin-top: 4px;
            min-height: 18px;
        }
        .success-msg {
            color: #388E3C;
            font-size: 13px;
            margin-top: 4px;
            min-height: 18px;
        }

        @media (max-width: 480px) {
            .select-row {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JSON 工具</h1>

        <!-- 输入 -->
        <label for="jsonInput">输入：</label>
        <textarea id="jsonInput" placeholder='输入 JSON 或字符串，例如: {"name":"hello","items":[1,2,3]}'></textarea>

        <!-- 两个选择框：压缩/解压 ｜ 转义/反转义 -->
        <div class="select-row">
            <div class="select-group">
                <select id="compressSelect">
                    <option value="none">无</option>
                    <option value="compress">压缩</option>
                    <option value="decompress">解压（格式化）</option>
                </select>
                <span class="select-label">① 压缩 / 解压</span>
            </div>
            <div class="select-group">
                <select id="escapeSelect">
                    <option value="none">无</option>
                    <option value="escape">转义</option>
                    <option value="unescape">反转义</option>
                </select>
                <span class="select-label">② 转义 / 反转义</span>
            </div>
        </div>

        <!-- 输出 -->
        <label for="jsonOutput">输出：</label>
        <textarea id="jsonOutput" class="output" readonly placeholder="处理结果将显示在这里..."></textarea>

        <div class="button-row">
            <button id="executeBtn">执行</button>
            <button id="copyBtn" class="btn-copy" style="display:none;">复制结果</button>
            <button id="clearBtn" class="btn-clear">清空</button>
        </div>

        <div id="outputMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script src="jsontools.js"></script>
</body>
</html>
